name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # >=22.18 required: scripts/check-voice.mjs imports narration.ts directly,
          # which needs Node's built-in type stripping. 20 is also EOL.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        # Kokoro's inference stack (~657MB of onnxruntime and transformers) is only
        # needed by scripts/generate-voice.mjs, which runs on a developer's machine.
        # The narration audio is committed, so the deploy never renders it.
        run: npm install --omit=optional

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
