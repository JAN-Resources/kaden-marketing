name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # >=22.18 required: scripts/check-voice.mjs imports narration.ts directly,
          # which needs Node's built-in type stripping. 20 is also EOL.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        # Plain install. Kokoro's inference stack is ~657MB the deploy never uses,
        # but --omit=optional is global rather than per-package: rollup ships its
        # platform native binary as an optionalDependency, so omitting optional
        # deps takes out rollup's own build engine.
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
